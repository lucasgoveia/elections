[workspace]
resolver = "2"
members = ["crates/eg-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.80"

[workspace.dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize", "rand_core", "digest"] }
sha2 = "0.10.9"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand_chacha = "0.3.1"
zeroize = "1.8"
subtle = "2.6"
thiserror = "2"
hex = "0.4"
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
